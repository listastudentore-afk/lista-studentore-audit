name: Hourly audit hash

on:
  schedule:
    - cron: "17 * * * *" # every hour, at minute 17 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency: hourly-hash

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record the current head
        run: node record-head.mjs

      # Generic GitHub Actions bot identity: no personal name or email in the history.
      - name: Commit heads.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add heads.csv
          git commit -m "Head $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # After the commit, so the head is published even when the recount fails.
      # A failure shows as a red run in the public Actions tab.
      - name: Full recount
        run: node verify.mjs
