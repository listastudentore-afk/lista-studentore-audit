name: Hourly audit hash

on:
  schedule:
    - cron: "17 * * * *" # every hour, at minute 17 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency: hourly-hash

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Writes heads.csv (main ranking) and tirana-heads.csv (Tirana 2027). If one chain cannot be read,
      # the other is still written; the step then fails, and the commit below still runs.
      - name: Record the current heads
        id: record
        run: node record-head.mjs

      # Failure is public information: write status before publishing, even if recording failed.
      - name: Full recount and status (both chains)
        if: ${{ !cancelled() }}
        run: node verify.mjs --status status.json

      # Generic GitHub Actions bot identity: no personal name or email in the history.
      - name: Commit heads and status.json
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for f in heads.csv tirana-heads.csv status.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Head $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
